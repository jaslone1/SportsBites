<div class="login-wrapper">
  <div class="login-card">
    <h1>Sports Bites</h1>
    <p>Sign in to claim your food!</p>

    <div *ngIf="infoMessage" class="alert alert-info d-flex align-items-center mb-4 shadow-sm" role="alert">
      <i class="bi bi-info-circle-fill me-2"></i>
      <div>
        {{ infoMessage }}
      </div>
    </div>

    <div *ngIf="errorMessage" class="error-box">
      {{ errorMessage }}
    </div>

    <!-- Demo Credentials Box with button -->
    <div class="alert alert-warning d-flex justify-content-between align-items-center mb-4 shadow-sm" role="alert">
      <div class="d-flex align-items-center">
        <i class="bi bi-star-fill me-2"></i>
        <div>
          <strong>Demo Account:</strong> testuser@sportsbites.local / TestPassword123!
        </div>
      </div>
      <button type="button" (click)="fillDemoCredentials()" class="btn btn-sm btn-outline-warning">
        Use Demo
      </button>
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Username</label>
        <input type="email" name="email" [(ngModel)]="loginData.email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="loginData.password" required>
      </div>

      <button type="submit" class="btn-login">Enter the Party</button>
    </form>
  </div>
</div>
